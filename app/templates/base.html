<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Library System{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('auth.dashboard') }}">Dashboard</a> |
        <a href="{{ url_for('books.book_list') }}">Books</a>
        {% if current_user.role in ['admin', 'librarian'] %}
            | <a href="{{ url_for('books.add_book') }}">Add Book</a>
            | <a href="{{ url_for('members.member_list') }}">Members</a>
            | <a href="{{ url_for('issues.issue_list') }}">Issues</a>
            | <a href="{{ url_for('fines.fine_list') }}">Fines</a>    
                    | <a href="{{ url_for('reservations.reservation_list') }}">Reservations</a>
        {% endif %}
        | <a href="{{ url_for('auth.logout') }}">Logout</a>
    </nav>
    <hr>

    {% with messages = get_flashed_messages() %}
        {% for msg in messages %}
            <p style="color:green">{{ msg }}</p>
        {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
