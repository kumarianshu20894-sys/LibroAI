{% extends "base.html" %}
{% block title %}Issue Book{% endblock %}
{% block content %}
<h2>Book Issue Karo</h2>

<form method="POST">
    <label>Member</label><br>
    <select name="member_id" required>
        {% for m in members %}
        <option value="{{ m.id }}">{{ m.user.name }} ({{ m.membership_type }})</option>
        {% endfor %}
    </select><br><br>

    <label>Available Copy</label><br>
    <select name="copy_id" required>
        {% for c in copies %}
        <option value="{{ c.id }}">{{ c.book.title }} - Copy {{ c.copy_number }} ({{ c.shelf or 'shelf nahi' }})</option>
        {% else %}
        <option value="">Koi copy available nahi hai</option>
        {% endfor %}
    </select><br><br>

    <button type="submit">Issue karo</button>
</form>
<br>
<a href="{{ url_for('issues.issue_list') }}">Wapas list par</a>
{% endblock %}
